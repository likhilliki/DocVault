<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="50%" style="stop-color:#00c4a0"/>
      <stop offset="100%" style="stop-color:#00b894"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Dark rounded background -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#bg)"/>
  <!-- Subtle inner glow -->
  <rect width="100" height="100" rx="22" ry="22" fill="none" stroke="#00d4aa" stroke-width="0.5" opacity="0.3"/>
  <!-- D shape / folder base -->
  <path d="M 20 22 L 20 75 Q 20 80 25 80 L 55 80 Q 78 80 82 62 L 82 38 Q 82 20 60 20 L 25 20 Q 20 20 20 25 Z" 
        fill="url(#grad)" opacity="0.9" filter="url(#glow)"/>
  <!-- Folder tab -->
  <path d="M 20 22 L 20 28 L 45 28 L 50 22 Z" fill="url(#grad)" opacity="0.6"/>
  <!-- Inner document pages -->
  <path d="M 30 35 L 30 70 L 62 70 Q 72 70 72 58 L 72 42 Q 72 32 62 32 L 35 32 Q 30 32 30 37 Z" 
        fill="#0d1117" opacity="0.85"/>
  <!-- Shield shape in center -->
  <path d="M 51 42 L 44 46 L 44 56 Q 44 63 51 66 Q 58 63 58 56 L 58 46 Z" 
        fill="url(#grad)" opacity="0.95"/>
  <!-- Lock icon in shield -->
  <rect x="47.5" y="53" width="7" height="5.5" rx="1" fill="#0d1117"/>
  <path d="M 48.5 53 L 48.5 51 Q 48.5 48.5 51 48.5 Q 53.5 48.5 53.5 51 L 53.5 53" 
        fill="none" stroke="#0d1117" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="51" cy="55.5" r="1" fill="url(#grad)" opacity="0.8"/>
  <!-- Shine highlight -->
  <ellipse cx="35" cy="30" rx="8" ry="4" fill="white" opacity="0.08" transform="rotate(-15 35 30)"/>
</svg>
